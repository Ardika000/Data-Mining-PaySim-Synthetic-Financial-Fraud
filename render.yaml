# Render Blueprint — deploy dashboard Phase 5 (gratis, region Singapura = latency terendah ke Indonesia).
# Cara pakai: push repo ke GitHub -> render.com -> New + -> Blueprint -> pilih repo ini.
services:
  - type: web
    name: paysim-kdd-dashboard
    runtime: python
    region: singapore
    plan: free
    rootDir: notebooks/Phase5/dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    autoDeploy: true
